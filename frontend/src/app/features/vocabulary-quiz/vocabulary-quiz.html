<app-guest-notice [visible]="showGuestNotice()" (continue)="onGuestContinue()" />
<app-confirm-modal />

@if (runner(); as r) {
  @if (r.current(); as word) {
    <div class="question">
      <div class="prompt">{{ word.de }}</div>
      <div class="options">
        @for (option of options(); track option.he) {
          <button
            type="button"
            class="option"
            [class.selected]="selected() === option.he"
            [class.correct]="checked() && option.he === word.he"
            [class.wrong]="checked() && selected() === option.he && option.he !== word.he"
            [disabled]="checked()"
            (click)="select(option)"
          >
            <span class="he">{{ option.he }}</span>
            <span class="en">{{ option.en }}</span>
          </button>
        }
      </div>
    </div>
  } @else {
    <div class="completion">
      <h2>🎉 You finished the vocabulary section!</h2>
      <div class="actions">
        <button type="button" class="btn btn-primary" (click)="reset()">Practice Again</button>
        <a class="btn btn-secondary" [routerLink]="['/lektion', lektionId]">Back to Lesson</a>
      </div>
    </div>
  }

  <app-quiz-controls
    [visible]="!!r.current()"
    [total]="r.total"
    [mastered]="r.masteredCount()"
    [checked]="checked()"
    [correct]="wasCorrect()"
    [canCheck]="!!selected()"
    (check)="check()"
    (continueNext)="continueNext()"
    (reset)="reset()"
  />
}
