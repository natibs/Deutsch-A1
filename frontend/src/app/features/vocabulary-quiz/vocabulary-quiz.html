<app-guest-notice [visible]="showGuestNotice()" (continue)="onGuestContinue()" />
<app-confirm-modal />

@if (runner(); as r) {
  @if (r.current(); as word) {
    <div class="question">
      @if (reverse) {
        <div class="prompt reverse">
          <span class="he">{{ word.he }}</span>
          <span class="prompt-secondary">{{ word.en }}</span>
        </div>
      } @else {
        <div class="prompt">{{ wordWithArticle(word) }}</div>
      }
      <div class="options">
        @for (option of options(); track option.key) {
          <button
            type="button"
            class="option"
            [class.selected]="selected() === option.key"
            [class.correct]="checked() && option.key === correctKey(word)"
            [class.wrong]="checked() && selected() === option.key && option.key !== correctKey(word)"
            [disabled]="checked()"
            (click)="select(option)"
          >
            <span class="primary" [class.he]="option.primaryIsHebrew">{{ option.primary }}</span>
            @if (option.secondary) {
              <span class="secondary">{{ option.secondary }}</span>
            }
          </button>
        }
      </div>
    </div>
  } @else {
    <div class="completion">
      <h2>🎉 You finished the vocabulary section!</h2>
      <div class="actions">
        <button type="button" class="btn btn-primary" (click)="reset()">Practice Again</button>
        <a class="btn btn-secondary" [routerLink]="['/lektion', lektionId]">Back to Lesson</a>
      </div>
    </div>
  }

  <app-quiz-controls
    [visible]="!!r.current()"
    [total]="r.total"
    [mastered]="r.masteredCount()"
    [checked]="checked()"
    [correct]="wasCorrect()"
    [canCheck]="!!selected()"
    (check)="check()"
    (continueNext)="continueNext()"
    (reset)="reset()"
  />
}
